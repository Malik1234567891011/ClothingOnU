name: ClothingOnU
options:
  bundleIdPrefix: com.clothingonu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  ClothingOnU:
    type: application
    platform: iOS
    sources:
      - path: ClothingOnU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clothingonu.app
        INFOPLIST_FILE: ClothingOnU/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
  ClothingOnUTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ClothingOnUTests]
    dependencies:
      - target: ClothingOnU
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClothingOnU.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ClothingOnU
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ClothingOnU:
    build:
      targets:
        ClothingOnU: all
        ClothingOnUTests: [test]
    test:
      targets: [ClothingOnUTests]
